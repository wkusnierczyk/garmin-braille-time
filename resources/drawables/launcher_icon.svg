<svg width="100px" 
     height="100px" 
     viewBox="0 0 100 100" 
     version="1.1" 
     xmlns="http://www.w3.org/2000/svg">
    
    <title>
        Braille Digit 0 (Letter J)
    </title>
    <desc>
        Solid black background with large orange braille dots representing the letter J. 
        Dots 2, 4, 5 are filled; dots 1, 3, 6 are hollow outlines.
    </desc>
    
    <defs>
        <style>
            .background { fill: #000000; }
            .dot-raised { 
                fill: #E88300; 
                stroke: #E88300;
                stroke-width: 1;
            }
            .dot-flat { 
                fill: none; 
                stroke: #E88300; 
                stroke-width: 1; 
            }
        </style>
    </defs>

    <rect x="0" y="0" width="100" height="100" class="background"/>

    <g id="braille-j">
        <circle cx="37" cy="25" r="10" class="dot-flat"/>
        <circle cx="37" cy="50" r="10" class="dot-raised"/>
        <circle cx="37" cy="75" r="10" class="dot-flat"/>

        <circle cx="62" cy="25" r="10" class="dot-raised"/>
        <circle cx="62" cy="50" r="10" class="dot-raised"/>
        <circle cx="62" cy="75" r="10" class="dot-flat"/>
    </g>
    
</svg>